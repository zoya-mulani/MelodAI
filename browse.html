        ];
        const podcasts = [
            { id: "p01", title: "Struggle With Small Talks", artist: "Conversation Coach", cover: "images/small talks.jpg", src: "podcast/Never Struggle with Small Talk Again  Easy Tips for Better Conversations.mp3", type: "podcast"},
            { id: "p02", title: "Billionaire’s Brain vs Your Brain", artist: "Gadget Gurus", cover: "images/billionares_brain_podcast.jpg", type: "podcast", src :"podcast/Billionaire’s Brain vs Your Brain_ Morning Routine, Focus & Addiction _ Dr Sweta _ FO403 Raj Shamani [fHBR1j1kJ1I].mp3"},
            { id: "p03", title: "How to stay calm", artist: "Comedy Central", cover: "images/stay_calm_podcast.png", type: "podcast", src:"podcast/How to stay calm when you know you'll be stressed  Daniel Levitin  TED.mp3"},
            { id: "p04", title: "Dangerously Confident", artist: "Aaron Mahnke", cover: "images/confident_podcast.jpg", type: "podcast", src:"podcast/Give me 15 Minutes and I'll Make you Dangerously Confident.mp3"},
        ];
        
        const playlists = [
            { id: 'pl01', name: 'Discover Weekly', description: 'Your weekly mixtape.', cover: 'https://misc.scdn.co/liked-songs/liked-songs-640.png', trackIds: ['s10', 's12', 's05', 's02', 's08'] },
            { id: 'pl02', name: 'Daily Mix 1', description: 'Pritam, Vishal-Shekhar...', cover: 'https://d1csarkz8obe9u.cloudfront.net/posterpreviews/spotify-album-art-daily-mixtape-music-cover-design-template-1582b532e7b570489d9d134aa9d2b48b_screen.jpg?ts=1737377279', trackIds: ['s03', 's04', 's06', 's07'] },
            { id: 'pl03', name: 'Bollywood Beats', description: 'The hottest tracks.', cover: 'images/dilli_wali_girlfriend.jpg', trackIds: ['s01', 's09', 's07', 's08', 's05'] },
            { id: 'pl04', name: 'K-Pop Fever', description: 'Essential K-Pop tracks.', cover: 'images/still_with_you.jpg', trackIds: ['s10', 's11'] },
        ];

        const allTracks = [...songs, ...podcasts];
        let likedState = JSON.parse(localStorage.getItem('melodai_likedState')) || {};
        let currentIndex = 0;
        let isPlaying = false;

        window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 50));
        document.querySelector(".search-icon").addEventListener("click", () => searchWrapper.classList.add("active"));
        document.querySelector(".close-btn").addEventListener("click", () => { 
            searchWrapper.classList.remove("active"); 
            searchInput.value = ""; 
            showBrowseContent(); // Go back to browse view when search is cleared
        });

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'light') { body.classList.add('light-theme'); themeToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun'); }
        themeToggle.addEventListener('click', () => { body.classList.toggle('light-theme'); const isLight = body.classList.contains('light-theme'); themeToggle.querySelector('i').classList.toggle('fa-sun', isLight); themeToggle.querySelector('i').classList.toggle('fa-moon', !isLight); localStorage.setItem('theme', isLight ? 'light' : 'dark'); });

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) {
                showBrowseContent();
                return;
            }
            const results = allTracks.filter(track => 
                track.title.toLowerCase().includes(query) || 
                track.artist.toLowerCase().includes(query)
            );
            playlistViewTitle.textContent = `Search Results for "${query}"`;
            playlistViewContainer.innerHTML = '';
            if (results.length > 0) {
                results.forEach(track => {
                    playlistViewContainer.appendChild(createTrackCard(track));
                });
            } else {
                playlistViewContainer.innerHTML = `<p>No results found.</p>`;
            }
            updateLikeUI();
            showPlaylistViewContent();
        }
        searchInput.addEventListener("input", performSearch);

        function createTrackCard(track) {
            const card = document.createElement('div');
            card.className = 'card11';
            card.dataset.id = track.id;
            card.innerHTML = `<img src="${track.cover}" alt="${track.title} cover art"><h3>${track.title}</h3><p>${track.artist}</p><button class="like-btn-card" aria-label="Like ${track.title}"><i class="far fa-heart"></i></button>`;
            const trackIndex = allTracks.findIndex(t => t.id === track.id);
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.like-btn-card')) {
                    selectAndPlay(trackIndex);
                }
            });
            const likeButton = card.querySelector('.like-btn-card');
            likeButton.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                likedState[track.id] = !likedState[track.id]; 
                localStorage.setItem('melodai_likedState', JSON.stringify(likedState)); 
                updateLikeUI(); 
            });
            return card;
        }

        function createPlaylistCard(playlist) {
            const card = document.createElement('div');
            card.className = 'card11';
            card.dataset.id = playlist.id;
            card.innerHTML = `<img src="${playlist.cover}" alt="${playlist.name} cover art"><h3>${playlist.name}</h3><p>${playlist.description}</p>`;
            card.addEventListener('click', () => displayPlaylist(playlist.id));
            return card;
        }

        function renderBrowseContent() {
            playlists.forEach(playlist => browsePlaylistsContainer.appendChild(createPlaylistCard(playlist)));
            songs.slice(0, 5).forEach(song => browseChartsContainer.appendChild(createTrackCard(song)));
            songs.slice(5, 10).forEach(song => browseReleasesContainer.appendChild(createTrackCard(song)));
            podcasts.forEach(podcast => browsePodcastsContainer.appendChild(createTrackCard(podcast)));
        }
        
        function displayPlaylist(playlistId) {
            const playlist = playlists.find(p => p.id === playlistId);
            if (!playlist) return;
            playlistViewTitle.textContent = playlist.name;
            playlistViewContainer.innerHTML = '';
            playlist.trackIds.forEach(trackId => {
                const track = allTracks.find(t => t.id === trackId);
                if (track) playlistViewContainer.appendChild(createTrackCard(track));
            });
            updateLikeUI();
            showPlaylistViewContent();
        }

        // SIMPLIFIED: Functions to toggle between the two views
        function showBrowseContent() {
            browseContent.style.display = 'block';
            playlistView.style.display = 'none';
        }
        function showPlaylistViewContent() {
            browseContent.style.display = 'none';
            playlistView.style.display = 'block';
        }

        backButton.addEventListener('click', showBrowseContent);

        function loadSong(index) {
            const track = allTracks[index];
            audio.src = track.src;
            playerCover.src = track.cover;
            playerTitle.textContent = track.title;
            playerArtist.textContent = track.artist;
            miniCover.src = track.cover;
            miniTitle.textContent = track.title;
            miniArtist.textContent = track.artist;
            updatePlayingCard();
            updateLikeUI();
        }

        function playSong() { audio.play().catch(e => console.error("Play failed:", e)); }
        function pauseSong() { audio.pause(); }

        function selectAndPlay(index) {
            currentIndex = (index + allTracks.length) % allTracks.length;
            loadSong(currentIndex);
            playSong();
        }

        function updatePlayButtons() { const icon = isPlaying ? 'fa-pause' : 'fa-play'; playBtn.innerHTML = `<i class="fas ${icon}"></i>`; miniPlayBtn.innerHTML = `<i class="fas ${icon}"></i>`; }
        function updatePlayingCard() { 
            document.querySelectorAll('.card11.playing').forEach(c => c.classList.remove('playing')); 
            if(allTracks[currentIndex]) {
                const currentTrack = allTracks[currentIndex];
                document.querySelectorAll(`.card11[data-id="${currentTrack.id}"]`).forEach(card => card.classList.add('playing'));
            }
        }
        function formatTime(s) { const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
        function updateProgress() { if (audio.duration) { progress.value = (audio.currentTime / audio.duration) * 100; currentTimeEl.textContent = formatTime(audio.currentTime); } }
        function setDuration() { if (audio.duration) durationEl.textContent = formatTime(audio.duration); }
        
        function updateLikeUI() {
            const currentTrackId = allTracks[currentIndex]?.id;
            const isLiked = likedState[currentTrackId];
            likeBtn.classList.toggle("liked", !!isLiked);
            likeBtn.innerHTML = `<i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>`;
            
            document.querySelectorAll('.like-btn-card').forEach(btn => {
                const cardId = btn.closest('.card11').dataset.id;
                const cardIsLiked = likedState[cardId];
                btn.classList.toggle('liked', !!cardIsLiked);
                btn.innerHTML = `<i class="${cardIsLiked ? 'fas' : 'far'} fa-heart"></i>`;
            });

            likedSongsListEl.innerHTML = "";
            likedPodcastsListEl.innerHTML = "";
            let songCount = 0, podcastCount = 0;
            
            allTracks.forEach((track, i) => {
                if (likedState[track.id]) {
                    const item = document.createElement("div");
                    item.className = "playlist-item";
                    item.innerHTML = `<img src="${track.cover}" alt="${track.title}"><div class="song-info"><div class="title">${track.title}</div><div class="artist">${track.artist}</div></div>`;
                    item.addEventListener("click", () => selectAndPlay(i));
                    if (track.type === 'music') { songCount++; likedSongsListEl.appendChild(item); } 
                    else if (track.type === 'podcast') { podcastCount++; likedPodcastsListEl.appendChild(item); }
                }
            });

            likedCountEl.textContent = songCount > 0 ? `Liked Songs (${songCount})` : 'Liked Songs';
            likedPodcastCountEl.textContent = podcastCount > 0 ? `Liked Podcasts (${podcastCount})` : 'Liked Podcasts';
        }

        function updateVolumeIcon() {
            if (audio.muted || audio.volume === 0) volumeIcon.innerHTML = '<i class="fas fa-volume-mute"></i>';
            else if (audio.volume < 0.5) volumeIcon.innerHTML = '<i class="fas fa-volume-down"></i>';
            else volumeIcon.innerHTML = '<i class="fas fa-volume-up"></i>';
        }

        volumeSlider.addEventListener("input", () => { audio.muted = false; audio.volume = volumeSlider.value; updateVolumeIcon(); });
        volumeIcon.addEventListener("click", () => { audio.muted = !audio.muted; volumeSlider.value = audio.muted ? 0 : audio.volume; updateVolumeIcon(); });

        playBtn.addEventListener("click", () => isPlaying ? pauseSong() : playSong());
        miniPlayBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        nextBtn.addEventListener("click", () => selectAndPlay(currentIndex + 1));
        miniNextBtn.addEventListener('click', () => selectAndPlay(currentIndex + 1));
        prevBtn.addEventListener("click", () => selectAndPlay(currentIndex - 1));
        miniPrevBtn.addEventListener('click', () => selectAndPlay(currentIndex - 1));
        likeBtn.addEventListener("click", () => { 
            const currentTrackId = allTracks[currentIndex].id;
            likedState[currentTrackId] = !likedState[currentTrackId]; 
            localStorage.setItem('melodai_likedState', JSON.stringify(likedState)); 
            updateLikeUI(); 
        });
        
        audio.addEventListener('play', () => { isPlaying = true; updatePlayButtons(); });
        audio.addEventListener('pause', () => { isPlaying = false; updatePlayButtons(); });
        audio.addEventListener('ended', () => nextBtn.click());
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', setDuration);
        progress.addEventListener("input", () => { if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration; });
        
        // --- INITIALIZATION ---
        renderBrowseContent();
        loadSong(currentIndex);
        updateLikeUI();
    });
  </script>
</body>
</html>
